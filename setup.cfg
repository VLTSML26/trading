[metadata]
name = VLTSML26-trading
version = 0.1.0
description = Toolkit per backtesting, market data e gestione portafoglio
long_description = file: README.md
long_description_content_type = text/markdown
author = Samuele Voltan
license = MIT
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
package_dir =
    = src
install_requires =
    aiohttp==3.13.2
    matplotlib==3.7.2
    numpy==1.25.1
    pandas==2.3.3
    python-dotenv==1.2.1
    scipy==1.16.3
python_requires = >=3.10

[options.packages.find]
where = src
include = trading*

[options.entry_points]
console_scripts =
    trading = trading.cli:main
